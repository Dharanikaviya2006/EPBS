<script>
const DEFAULT_TAGS=["#HE5Solutions","#EventBranding","#Innovation"];
const frameUpload=document.getElementById("frameUpload");
const defaultCaption=document.getElementById("defaultCaption");
const defaultTags=document.getElementById("defaultTags");
const setupSection=document.getElementById("setupSection");
const photoEditorSection=document.getElementById("photoEditorSection");
const previewSection=document.getElementById("previewSection");
const goToPreviewBtn=document.getElementById("goToPreviewBtn");
const backToEditorBtn=document.getElementById("backToEditorBtn");
const previewImage=document.getElementById("previewImage");
const previewCaption=document.getElementById("previewCaption");
const previewHash=document.getElementById("previewHash");
const frameOverlay=document.getElementById("frameOverlay");
const userPhoto=document.getElementById("userPhoto");
const photoUpload=document.getElementById("photoUpload");
const captureArea=document.getElementById("captureArea");
const notice=document.getElementById("notice");
const backBtn=document.getElementById("backBtn");
const openCameraBtn=document.getElementById("openCameraBtn");
const cameraPreview=document.getElementById("cameraPreview");
const captureBtn=document.getElementById("captureBtn");
const switchCameraBtn=document.getElementById("switchCameraBtn");
const rotateBtn = document.getElementById("rotateBtn");
const downloadBtn=document.getElementById("downloadBtn");
const shareBtn=document.getElementById("shareBtn");
const downloadFormat=document.getElementById("downloadFormat");
const previewArea=document.getElementById("previewArea");
const retakeBtn = document.getElementById("retakeBtn");
const shutterWrapper = document.getElementById("shutterWrapper");

let frameRatio = 1;
let caption="", tags=[];

function enterFullscreen() {
  const el = document.documentElement;

  if (el.requestFullscreen) {
    el.requestFullscreen();
  } else if (el.webkitRequestFullscreen) {
    el.webkitRequestFullscreen();
  } else if (el.msRequestFullscreen) {
    el.msRequestFullscreen();
  }
}
function showStep(sectionToShow) {

  // Hide all sections
  setupSection.classList.add("hidden");
  photoEditorSection.classList.add("hidden");
  previewSection.classList.add("hidden");

  // Show requested section
  sectionToShow.classList.remove("hidden");
}

/* ======================================================
   TRUE FREE STYLE IMAGE ENGINE (CANVAS-LIKE)
====================================================== */
rotateBtn.onclick = () => {
  rotation = (rotation + 90) % 360;
  render();
};

/* ======================================================
   PROFESSIONAL FREE MOVE + SMART ZOOM ENGINE
====================================================== */

let baseScale = 1;
let scale = 1;
let posX = 0;
let posY = 0;
let rotation = 0;

let startX = 0;
let startY = 0;

const pointers = new Map();
let isDragging = false;
let pinchStartDistance = 0;
let pinchStartScale = 1;

/* GPU Smooth Render */
function render(){
  requestAnimationFrame(()=>{
    userPhoto.style.transform =
      `translate(-50%, -50%) 
       translate3d(${posX}px, ${posY}px, 0) 
       scale(${scale}) 
       rotate(${rotation}deg)`;
  });
}

/* Better Fit Logic */
function fitImage(){

  const rect = captureArea.getBoundingClientRect();

  const imgW = userPhoto.naturalWidth;
  const imgH = userPhoto.naturalHeight;

  const containerRatio = rect.width / rect.height;
  const imageRatio = imgW / imgH;

  if (imageRatio > containerRatio) {
    baseScale = rect.height / imgH;
  } else {
    baseScale = rect.width / imgW;
  }

  scale = baseScale;
  posX = 0;
  posY = 0;
  rotation = 0;

  render();
}

/* Zoom centered at pointer */
function zoomAt(clientX, clientY, newScale){

  newScale = Math.min(Math.max(newScale, baseScale * 0.2), baseScale * 8);

  const rect = captureArea.getBoundingClientRect();

  const cx = clientX - rect.left;
  const cy = clientY - rect.top;

  const dx = cx - rect.width / 2;
  const dy = cy - rect.height / 2;

  const ratio = newScale / scale;

  posX -= dx * (ratio - 1);
  posY -= dy * (ratio - 1);

  scale = newScale;

  render();
}

/* POINTER DOWN */
captureArea.addEventListener("pointerdown", e=>{
  captureArea.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, e);

  if(pointers.size === 1){
    isDragging = true;
    startX = e.clientX - posX;
    startY = e.clientY - posY;
  }
});

/* POINTER MOVE */
captureArea.addEventListener("pointermove", e=>{
  if(!pointers.has(e.pointerId)) return;

  pointers.set(e.pointerId, e);

  /* DRAG */
  if(pointers.size === 1 && isDragging){
    posX = e.clientX - startX;
    posY = e.clientY - startY;
    render();
  }

  /* PINCH ZOOM */
  if(pointers.size === 2){
    isDragging = false;

    const pts = [...pointers.values()];
    const dx = pts[1].clientX - pts[0].clientX;
    const dy = pts[1].clientY - pts[0].clientY;
    const distance = Math.hypot(dx, dy);

    if(!pinchStartDistance){
      pinchStartDistance = distance;
      pinchStartScale = scale;
    }

    const midX = (pts[0].clientX + pts[1].clientX) / 2;
    const midY = (pts[0].clientY + pts[1].clientY) / 2;

    zoomAt(midX, midY, pinchStartScale * (distance / pinchStartDistance));
  }
});

/* POINTER UP */
captureArea.addEventListener("pointerup", e=>{
  pointers.delete(e.pointerId);
  captureArea.releasePointerCapture(e.pointerId);
  if(pointers.size < 2) pinchStartDistance = 0;
  if(pointers.size === 0) isDragging = false;
});

/* ======================================================

====================================================== */
let currentFacing = "user";

/* Secure camera start */
let stream = null;
let currentDeviceId = null;
let availableCameras = [];

async function getLocalCameras() {

  const devices = await navigator.mediaDevices.enumerateDevices();

  const videoDevices = devices.filter(d => d.kind === "videoinput");

  // Filter out virtual / phone cameras by label keywords
  availableCameras = videoDevices.filter(device => {
    const label = device.label.toLowerCase();

    return !(
      label.includes("virtual") ||
      label.includes("droidcam") ||
      label.includes("epoccam") ||
      label.includes("continuity") ||
      label.includes("phone") ||
      label.includes("snap camera") ||
      label.includes("obs")
    );
  });

  return availableCameras;
}

async function startCamera() {

  if (!navigator.mediaDevices?.getUserMedia) {
    alert("Camera not supported.");
    return;
  }

  try {

    // Stop old stream
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    // 🔥 Get real local cameras
    const cameras = await getLocalCameras();

    if (!cameras.length) {
      alert("No local camera found.");
      return;
    }

    // If first time, use first real camera
    if (!currentDeviceId) {
      currentDeviceId = cameras[0].deviceId;
    }

    const constraints = {
      video: {
        deviceId: { exact: currentDeviceId },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    };

    stream = await navigator.mediaDevices.getUserMedia(constraints);

    cameraPreview.srcObject = stream;

    await new Promise(resolve => {
      cameraPreview.onloadedmetadata = resolve;
    });

    await cameraPreview.play();

    cameraPreview.style.display = "block";
    userPhoto.style.display = "none";

  } catch (err) {
    console.error("Camera error:", err);
    alert("Unable to access local camera.");
  }
}

  currentDeviceId = availableCameras[nextIndex].deviceId;

  await startCamera();
};

async function generateCanvas() {

  if (!userPhoto.src || !userPhoto.naturalWidth) {
    alert("No image loaded.");
    throw new Error("Image not loaded");
  }

  // Wait for layout to fully stabilize
  await new Promise(resolve => setTimeout(resolve, 50));

  const canvas = await html2canvas(captureArea, {
    useCORS: true,
    scale: window.devicePixelRatio, // fixed scale
    backgroundColor: "#ffffff", // IMPORTANT FIX
    removeContainer: true,
    logging: false
  });

  if (!canvas.width || !canvas.height) {
    throw new Error("Canvas render failed");
  }

  return canvas;
}

/* ===============================
   SHARE HELPER
=============================== */

async function shareFile(file, text) {

  if (navigator.canShare && navigator.canShare({ files: [file] })) {

    await navigator.share({
      files: [file],
      text: text
    });

  } else {

    await navigator.share({
      text: text
    });

    alert("File sharing not supported. Caption copied.");
  }
}


/* ===============================
   CLIPBOARD HELPER
=============================== */

async function copyCaption(text) {

  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {}
  }
}
